# LiteLLM Proxy (MIT core, Python): one gateway for Bedrock models AND MCP tools.
# Good fit when you also want budgets, keys and fallbacks for model calls on plain Bedrock.
#
# Syntax from the LiteLLM docs repo as of 31 Oct 2026 (v1.106.6). NOT executed in this repo; test it.
#   https://github.com/BerriAI/litellm-docs/blob/main/docs/mcp_openapi.md
#   https://github.com/BerriAI/litellm-docs/blob/main/docs/mcp_aws_sigv4.md
#   https://github.com/BerriAI/litellm-docs/blob/main/docs/mcp_control.md
#   https://github.com/BerriAI/litellm-docs/blob/main/docs/mcp_guardrail.md
#
# Differences from AgentCore and from diy_gateway:
# - Tools are named <alias>-<tool>. Inbound JWT/OIDC is an Enterprise feature; the free path is virtual keys.
# - allowed_params limits parameter NAMES only: the amount rule needs a custom Python guardrail
#   (it could call cedarpy with diy_gateway.policy.CedarEngine); its MCP hook mode is UNVERIFIED.
# - auth_type: api_key sends "Authorization: ApiKey <value>", so the X-API-Key header uses static_headers.
model_list:
  - model_name: claim-agent
    litellm_params:
      model: bedrock/us.anthropic.claude-sonnet-5-5     # check the inference profiles in your account
      aws_region_name: us-east-1

mcp_servers:
  undercover_app:
    url: "http://app.internal:8000"
    spec_path: "http://app.internal:8000/api/agent/openapi.json"
    static_headers:
      X-API-Key: "<from a secret store; os.environ/ references are UNVERIFIED here>"
    allowed_tools: [get_claim, get_policy, get_claim_history, calculate_payout, record_decision, pay_claim]
  undercover_context:
    url: "https://<url-id>.lambda-url.us-east-1.on.aws/mcp"
    transport: "http"
    auth_type: "aws_sigv4"

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
