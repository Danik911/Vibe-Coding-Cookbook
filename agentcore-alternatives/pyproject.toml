[project]
name = "agentcore-alternatives"
version = "0.1.0"
description = "Self-built alternatives to Bedrock AgentCore Gateway, Policy and Identity"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.123",
    "cedarpy>=4.12.2",
    "fastmcp>=4.1.4",
    "httpx2>=2.16.0",
    "mangum>=0.22.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.54.0",
]

[dependency-groups]
demo = [
    "fastapi>=0.162.0",
]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.uv]
default-groups = ["dev", "demo"]

[tool.ruff]
line-length = 120
extend-exclude = ["docs/research"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "SIM", "UP", "PL", "S", "PT", "ASYNC", "C90"]

[tool.ruff.lint.pylint]
max-args = 8

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "PLR2004"]
"examples/*" = ["S104", "S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
